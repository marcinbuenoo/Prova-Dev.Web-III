<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar para listagem -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📋 Gestão de Reservas</h2>
                <button class="btn btn-outline" onclick="fetchReservas()">Atualizar</button>
            </div>

            <div style="padding: 16px; border-bottom: 1px solid var(--border-color);">
                <input type="text" id="searchFilter" class="form-control" placeholder="Buscar cliente..." style="margin: 0;">
            </div>

            <div class="reservas-list" id="reservasList">
                <!-- Reservas serão injetadas aqui -->
            </div>
        </aside>

        <!-- Área principal com o mapa de mesas -->
        <main class="main-content">
            <header class="top-header">
                <h1>Mapa do Restaurante</h1>
                <div class="legend">
                    <span class="legend-item"><div class="color-box status-disponivel"></div> Disponível</span>
                    <span class="legend-item"><div class="color-box status-reservado"></div> Reservado</span>
                    <span class="legend-item"><div class="color-box status-ocupado"></div> Ocupado</span>
                </div>
            </header>

            <div class="restaurant-map" id="restaurantMap">
                <!-- Mesas serão geradas dinamicamente aqui -->
            </div>
        </main>
    </div>

    <!-- Modal de Interação da Mesa -->
    <div class="modal-overlay" id="mesaModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle">Mesa X</h2>
            <div id="modalBody">
                <!-- Conteúdo dinâmico (Formulário ou Detalhes) -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <div id="toastContainer" class="toast-container"></div>
</body>
</html>
